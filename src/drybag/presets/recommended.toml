# Who reads what: the configuration loader (`drybag.config`) reads [budgets], [native_caps] and
# [defaults.*] into a project's configuration; `drybag.setup`
# reads [plugins.<harness>] and [deny] when it installs a machine, and [defaults.personal] and
# [defaults.drybag] for its own answers.
#
# There is deliberately no [rules] table, and nothing reads one: this preset imposes no standing
# rule on anyone. A standing rule is the user's own note carrying `metadata.startup` in their
# overlay, which the `standing-rules` session-start bundle injects.

[budgets]
agents_md_lines = 300
agents_md_words = 3000
status_lines = 50
roadmap_prose_lines = 350
roadmap_prose_words = 3500
memory_index_words = 1200
startup_rules_words = 1600
volatile_notes_words = 2500
volatile_ttl_days = 30

[native_caps]
# Platform limits in their own units, read by the consumers they bound.
memory_index_lines = 200
memory_index_bytes = 25600
hook_output_chars = 10000

[defaults.project]
base_branch = "main"

[defaults.paths]
agents_md = "AGENTS.md"
specs = "docs/specs"
plans = "docs/plans"
roadmap = "docs/roadmap.md"
memory = "docs/memory"

[defaults.memory]
groups = ["developer", "project-stable", "project-volatile", "specs"]
index_extra = []

[defaults.commit_messages]
attribution_check = false

[defaults.personal]
preset = "recommended"

[plugins]
# Installed only when named: `drybag setup --plugin NAME` installs one, through each harness's own plugin command. A
# `setup` that names none installs none. Third-party skills are listed as recommendations in the
# README, never vendored.
#
# Unpinned, and that is a gap worth naming rather than hiding: whatever these selectors resolve
# to at install time runs in every session, and a third-party plugin can ship its own hooks and
# allow rules — a wider grant than the allow rule drybag's own author is forbidden to ship.
# Which is why none is installed unless the owner names it. A pin belongs here when the
# marketplaces expose a version selector to pin to.

[plugins.claude]
# Verified 2026-09-18 against the real `claude` CLI and `gh api repos/anthropics/claude-plugins-official`:
# both `superpowers` and `context7` ship in Anthropic's own official marketplace, which every
# Claude Code install already carries (`claude plugin marketplace list` lists it with no prior
# `marketplace add`) — the add call `setup` still makes is defence in depth, not a first
# registration, and it is idempotent (`claude plugin marketplace add` on an already-added source
# answers "already on disk" and exits 0). `claude plugin install <name>@<marketplace>` is the
# measured bare form — the install output the spike record
# (`docs/plans/2026-09-05-agent-harness-p0-spikes.md`) transcribes reports `(scope: user)` as the
# *default*, not a flag, and the record passes `-y` only to `uninstall`, never to `install`.
marketplace = "claude-plugins-official"
source = "anthropics/claude-plugins-official"

# Deliberately no [plugins.codex] table below: Codex has no verified non-interactive marketplace
# source for either plugin in `recommended` — the `superpowers` project's own install instructions
# document only an interactive `/plugins` search inside a Codex session, and the spike record's
# Codex trials (*Codex plugin hooks*, *plugin-root substitution and executable bits*) only ever
# registered scratch local directories, never a published marketplace. Nothing is vendored on a
# guess. `recommended` therefore names two plugins that `setup --plugin` installs on Claude Code
# only; `setup` reports the gap as a note (never silence, never a failure) rather than attempting
# an unverified install, and README.md's "This is not a replacement for superpowers" paragraph
# tells the owner to add both by hand on Codex. A reader of this file, the note `setup` prints,
# and the README should all find the same answer.

[deny]
# Machine-level deny rules, written into the user-scope settings. Deny only, always: the
# plugin author may never ship an allow rule, and a preset is a template by another name.
#
# The env files by name, never by a mask. A deny rule outranks every allow rule, so the mask this
# list used to hold, `.env*`, also refused `.env.example`, `.env.dist` and every other template a
# project commits for an agent to read and edit, and no rule anywhere could let one through. The
# names are the ones the common toolchains read; an env file under another name stays readable,
# because keeping secrets from an agent is the sandbox's job and the harness's, and a list that
# refuses a template is the defect this one replaced. A bare name matches at any depth in Claude
# Code's rules, so `**/` adds nothing but the spelling an earlier `setup` already wrote.
global = [
  "Read(**/.env)",
  "Read(**/.env.local)",
  "Read(**/.env.*.local)",
  "Read(**/.env.dev)",
  "Read(**/.env.development)",
  "Read(**/.env.prod)",
  "Read(**/.env.production)",
  "Read(**/.env.stage)",
  "Read(**/.env.staging)",
  "Read(**/.env.test)",
]
